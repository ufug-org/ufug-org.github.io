<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أفق - المحرك الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-gray-800">

    <div id="loginSection" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-96 text-center border-t-4 border-emerald-500">
            <h2 class="text-3xl font-extrabold mb-6 text-gray-800">بوابة <span class="text-emerald-600">أفق</span></h2>
            <input type="password" id="passwordInput" class="w-full p-3 border rounded-lg mb-4 text-center focus:outline-none focus:ring-2 focus:ring-emerald-500" placeholder="كلمة المرور">
            <button onclick="checkPassword()" class="w-full bg-emerald-600 text-white py-3 rounded-lg hover:bg-emerald-700 transition font-bold shadow-lg">تسجيل الدخول</button>
            <p id="errorMsg" class="text-red-500 mt-3 text-sm hidden font-bold">كلمة المرور غير صحيحة، حاول مجدداً.</p>
        </div>
    </div>

    <div id="dashboardSection" class="hidden container mx-auto p-4 md:p-8 max-w-6xl">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">إدارة مشاريع أفق</h1>
            </div>
            <button onclick="downloadJSON()" class="mt-4 md:mt-0 bg-blue-600 text-white px-6 py-3 rounded-lg shadow-md hover:bg-blue-700 transition font-bold flex items-center gap-2">
                <span>⬇️</span> تحميل projects.json
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- النموذج -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <h2 class="text-lg font-bold mb-4 text-emerald-700 border-b pb-2">➕ إضافة تطبيق جديد</h2>
                <form id="projectForm" onsubmit="addProject(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">اسم التطبيق</label>
                        <input type="text" id="pTitle" required class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">وصف قصير</label>
                        <textarea id="pDesc" required rows="3" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">اسم الأيقونة</label>
                            <input type="text" id="pImage" placeholder="مثال: app.png" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 text-left focus:outline-none" dir="ltr">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1">الحالة</label>
                            <select id="pStatus" class="w-full p-2 border rounded-lg bg-gray-50 focus:outline-none">
                                <option value="متوفر الآن">متوفر الآن</option>
                                <option value="قريباً">قريباً</option>
                                <option value="نسخة تجريبية">نسخة تجريبية</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">الكلمات المفتاحية (افصل بينها بفاصلة)</label>
                        <input type="text" id="pTags" placeholder="Windows, مجاني, مفتوح المصدر" class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">رابط التحميل</label>
                        <input type="url" id="pLink" placeholder="https://..." class="w-full p-2 border rounded-lg bg-gray-50 focus:ring-2 focus:ring-emerald-500 text-left focus:outline-none" dir="ltr">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg shadow hover:bg-emerald-700 transition font-bold">حفظ التطبيق</button>
                </form>
            </div>

            <!-- القائمة -->
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4 text-emerald-700 border-b pb-2">📂 تطبيقاتك</h2>
                <div id="projectsList" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script>
        let dataStore = { projects: [] };

        function checkPassword() {
            if(document.getElementById('passwordInput').value === 'sadeed') {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                fetchExistingData();
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        async function fetchExistingData() {
            try {
                const response = await fetch('projects.json?t=' + new Date().getTime());
                if(response.ok) { dataStore = await response.json(); }
            } catch (error) { console.log('ملف جديد.'); }
            renderList();
        }

        function renderList() {
            const list = document.getElementById('projectsList');
            list.innerHTML = '';
            
            if(dataStore.projects.length === 0) {
                list.innerHTML = '<p class="text-gray-400 text-center py-8">لا توجد تطبيقات مضافة.</p>';
                return;
            }

            dataStore.projects.forEach((proj, index) => {
                let tagsHtml = proj.tags ? proj.tags.map(tag => `<span class="bg-gray-200 text-gray-700 text-[10px] px-1.5 py-0.5 rounded mr-1">${tag}</span>`).join('') : '';
                let imgSrc = proj.image ? `Photos/${proj.image}` : 'https://via.placeholder.com/40';

                list.innerHTML += `
                    <div class="flex justify-between items-center p-4 border rounded-xl hover:shadow-md transition bg-gray-50">
                        <div class="flex items-center gap-4 w-full">
                            <img src="${imgSrc}" onerror="this.src='https://via.placeholder.com/40'" class="w-12 h-12 rounded-lg object-cover border border-gray-200 flex-shrink-0">
                            <div class="flex-grow">
                                <h3 class="font-bold text-gray-800 mb-1">${proj.title} <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full mr-2">${proj.status}</span></h3>
                                <p class="text-xs text-gray-500 line-clamp-1 mb-1">${proj.description}</p>
                                <div>${tagsHtml}</div>
                            </div>
                            <button onclick="deleteProject(${index})" class="text-red-500 hover:bg-red-100 px-3 py-2 rounded-lg transition text-sm font-bold flex-shrink-0">حذف</button>
                        </div>
                    </div>
                `;
            });
        }

        function addProject(e) {
            e.preventDefault();
            
            // معالجة الكلمات المفتاحية
            const rawTags = document.getElementById('pTags').value;
            const tagsArray = rawTags.split(',').map(tag => tag.trim()).filter(tag => tag !== "");

            const newProject = {
                title: document.getElementById('pTitle').value,
                description: document.getElementById('pDesc').value,
                status: document.getElementById('pStatus').value,
                link: document.getElementById('pLink').value,
                image: document.getElementById('pImage').value,
                tags: tagsArray
            };
            
            dataStore.projects.unshift(newProject);
            renderList();
            document.getElementById('projectForm').reset();
        }

        function deleteProject(index) {
            if(confirm('هل أنت متأكد من الحذف؟')) {
                dataStore.projects.splice(index, 1);
                renderList();
            }
        }

        function downloadJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(dataStore, null, 4));
            const node = document.createElement('a');
            node.setAttribute("href", dataStr);
            node.setAttribute("download", "projects.json");
            document.body.appendChild(node);
            node.click();
            node.remove();
        }
    </script>
</body>
</html>
